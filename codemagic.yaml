workflows:
  android-apk:
    name: MSAgencies APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.22.2
      java: 17
      groups:
        - google_play
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/**/*.apk
